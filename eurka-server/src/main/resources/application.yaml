server:
  port: 8761

spring:
  application:
    name: eurka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

#logging
logging:
  level:
    root: INFO
    com.server: DEBUG
    org.springframework.web: INFO

  file:
    name: logs/application.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"


